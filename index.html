<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Алгебра-9 · Репетитор</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F6F1;
    --paper-2:#ECEFE7;
    --grid:#C7D3D9;
    --ink:#1F3A5F;
    --ink-2:#2C4F7C;
    --ink-soft:#5A7290;
    --red:#B23A2E;
    --green:#3F7A5D;
    --amber:#B4791F;
    --card:#FFFFFF;
    --line:#D8DED2;
    --text:#233127;
    --text-soft:#5B675C;
    --shadow: 0 1px 2px rgba(31,58,95,.06), 0 6px 20px rgba(31,58,95,.06);
    --font-head: 'Fraunces', serif;
    --font-body: 'Source Sans 3', -apple-system, sans-serif;
    --font-hand: 'Caveat', cursive;
    --radius: 10px;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --paper:#161B17;
      --paper-2:#1C221D;
      --grid:#2A3630;
      --ink:#9FBEE8;
      --ink-2:#B7CDF0;
      --ink-soft:#7E97B8;
      --red:#E08277;
      --green:#7FC7A2;
      --amber:#E3B15C;
      --card:#1E241F;
      --line:#313C33;
      --text:#E7ECE4;
      --text-soft:#A7B3A3;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
      --paper:#161B17;
      --paper-2:#1C221D;
      --grid:#2A3630;
      --ink:#9FBEE8;
      --ink-2:#B7CDF0;
      --ink-soft:#7E97B8;
      --red:#E08277;
      --green:#7FC7A2;
      --amber:#E3B15C;
      --card:#1E241F;
      --line:#313C33;
      --text:#E7ECE4;
      --text-soft:#A7B3A3;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0/100% 34px,
      var(--paper);
    background-attachment:local;
    color:var(--text);
    font-family:var(--font-body);
    font-size:15.5px;
    line-height:1.55;
    min-height:100vh;
  }
  body::before{content:none;}

  .app{
    display:grid;
    grid-template-columns: 292px 1fr;
    min-height:100vh;
  }
  @media (max-width: 860px){
    .app{grid-template-columns: 1fr;}
    .rail{position:relative; border-right:none; border-bottom:3px solid var(--red); max-height:none;}
  }

  /* ---------- Left rail ---------- */
  .rail{
    background:var(--paper-2);
    border-right:3px solid var(--red);
    padding:22px 0 30px;
    position:sticky; top:0; align-self:start; height:100vh; overflow-y:auto;
  }
  @media (max-width:860px){ .rail{ position:static; height:auto; } }

  .brand{padding:0 20px 18px; border-bottom:1px solid var(--line); margin-bottom:14px;}
  .brand .mark{
    font-family:var(--font-head); font-weight:700; font-size:22px; color:var(--ink);
    letter-spacing:.2px;
  }
  .brand .sub{color:var(--text-soft); font-size:12.5px; margin-top:3px;}

  .progress-wrap{padding:0 20px 16px; border-bottom:1px solid var(--line); margin-bottom:8px;}
  .progress-label{display:flex; justify-content:space-between; font-size:12px; color:var(--text-soft); margin-bottom:6px;}
  .progress-bar{height:6px; background:var(--line); border-radius:4px; overflow:hidden;}
  .progress-fill{height:100%; background:var(--green); border-radius:4px; transition:width .4s ease;}

  .chapter{margin-top:6px;}
  .chapter-head{
    padding:10px 20px 6px; font-family:var(--font-head); font-weight:600; font-size:13.5px;
    color:var(--ink-soft); text-transform:none; letter-spacing:.1px;
  }
  .topic-btn{
    display:flex; align-items:center; gap:9px; width:100%; text-align:left;
    padding:8px 20px; border:none; background:transparent; cursor:pointer;
    font-family:var(--font-body); font-size:13.6px; color:var(--text);
    border-left:3px solid transparent;
  }
  .topic-btn:hover{background:rgba(31,58,95,.06);}
  .topic-btn.active{
    background:var(--card); border-left-color:var(--ink); color:var(--ink); font-weight:600;
    box-shadow: inset 0 0 0 1px var(--line);
  }
  .topic-btn .num{
    flex:none; width:20px; height:20px; border-radius:50%; border:1.4px solid var(--ink-soft);
    display:flex; align-items:center; justify-content:center; font-size:10.5px; color:var(--ink-soft);
  }
  .topic-btn.done .num{background:var(--green); border-color:var(--green); color:#fff;}
  .topic-btn .ttl{flex:1; line-height:1.3;}

  /* ---------- Main ---------- */
  .main{padding: 26px 30px 60px; max-width: 900px;}
  @media (max-width:600px){ .main{padding:18px 16px 40px;} }

  .topbar{display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:18px;}
  .crumbs{font-size:12.5px; color:var(--text-soft);}
  .crumbs b{color:var(--ink);}
  .reset-link{font-size:12px; color:var(--text-soft); background:none; border:none; cursor:pointer; text-decoration:underline; text-underline-offset:2px; padding:0;}

  .topic-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:22px 24px 20px; margin-bottom:18px;
  }
  .topic-title{font-family:var(--font-head); font-size:25px; font-weight:600; color:var(--ink); margin:0 0 8px; line-height:1.25;}
  .topic-blurb{color:var(--text-soft); font-size:14px; margin:0 0 16px; max-width:64ch;}

  .mark-done{
    display:inline-flex; align-items:center; gap:7px; font-size:12.5px; color:var(--text-soft);
    cursor:pointer; user-select:none; margin-bottom:4px;
  }
  .mark-done input{accent-color:var(--green); width:15px; height:15px;}

  .tabs{display:flex; gap:6px; margin:16px 0 0; border-bottom:1px solid var(--line); flex-wrap:wrap;}
  .tab{
    font-family:var(--font-body); font-size:13.5px; font-weight:600; color:var(--text-soft);
    background:none; border:none; padding:9px 4px; margin-right:14px; cursor:pointer;
    border-bottom:2.5px solid transparent; position:relative; top:1px;
  }
  .tab.active{color:var(--ink); border-bottom-color:var(--ink);}

  .panel{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:20px 22px; min-height:220px;
  }
  .panel-hint{font-size:13px; color:var(--text-soft); margin:0 0 14px; padding-bottom:12px; border-bottom:1px dashed var(--line);}
  .panel-hint b{color:var(--amber); font-weight:600;}

  .chat-log{display:flex; flex-direction:column; gap:14px; margin-bottom:14px;}
  .msg{max-width:86%; padding:11px 14px; border-radius:10px; font-size:14.5px; line-height:1.55;}
  .msg p{margin:0 0 8px;} .msg p:last-child{margin-bottom:0;}
  .msg ul{margin:6px 0; padding-left:20px;}
  .msg.student{align-self:flex-end; background:var(--ink); color:#fff; border-bottom-right-radius:3px;}
  .msg.tutor{align-self:flex-start; background:var(--paper-2); color:var(--text); border:1px solid var(--line); border-bottom-left-radius:3px;}
  .msg.tutor .label, .msg.student .label{
    display:block; font-family:var(--font-hand); font-size:15px; margin-bottom:2px; opacity:.75;
  }
  .msg.system{align-self:center; color:var(--text-soft); font-size:12.5px; background:none; text-align:center; max-width:100%;}

  .composer{display:flex; gap:8px; align-items:flex-end; margin-top:6px;}
  .composer textarea{
    flex:1; resize:none; min-height:44px; max-height:160px; padding:11px 13px;
    border:1.4px solid var(--line); border-radius:8px; font-family:var(--font-body); font-size:14.5px;
    background:var(--paper); color:var(--text); line-height:1.4;
  }
  .composer textarea:focus{outline:none; border-color:var(--ink-soft);}
  .send-btn{
    flex:none; background:var(--ink); color:#fff; border:none; border-radius:8px;
    padding:0 18px; height:44px; font-family:var(--font-body); font-weight:600; font-size:14px; cursor:pointer;
  }
  .send-btn:disabled{opacity:.5; cursor:default;}
  .send-btn:hover:not(:disabled){background:var(--ink-2);}

  .quick-row{display:flex; gap:8px; flex-wrap:wrap; margin:2px 0 14px;}
  .quick-chip{
    font-size:12.5px; padding:6px 11px; border-radius:999px; border:1px solid var(--line);
    background:var(--paper); color:var(--ink-soft); cursor:pointer;
  }
  .quick-chip:hover{border-color:var(--ink-soft); color:var(--ink);}

  .typing{display:inline-flex; gap:4px; align-items:center; padding:2px 0;}
  .typing span{width:5px; height:5px; border-radius:50%; background:var(--ink-soft); animation: blink 1.2s infinite ease-in-out;}
  .typing span:nth-child(2){animation-delay:.2s;} .typing span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.25;} 40%{opacity:1;}}

  .quiz-card{border:1px solid var(--line); border-radius:9px; padding:16px 18px; background:var(--paper);}
  .quiz-q{font-size:15.5px; margin:0 0 12px; color:var(--text);}
  .quiz-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
  .ghost-btn{
    background:none; border:1.4px solid var(--line); color:var(--ink); border-radius:7px;
    padding:8px 14px; font-size:13px; font-weight:600; cursor:pointer; font-family:var(--font-body);
  }
  .ghost-btn:hover{border-color:var(--ink-soft);}
  .ghost-btn.primary{background:var(--ink); color:#fff; border-color:var(--ink);}
  .ghost-btn.primary:hover{background:var(--ink-2);}
  .reveal{margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); font-size:14px;}
  .reveal .k{color:var(--amber); font-weight:600;}

  .empty-state{color:var(--text-soft); font-size:14px; text-align:center; padding:30px 10px;}

  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:6px;}

  .sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0);}
</style>
</head>
<body>

<div class="app">
  <nav class="rail" id="rail">
    <div class="brand">
      <div class="mark">📐 Алгебра-9 · Репетитор</div>
      <div class="sub">Мерзляк, Якір — підручник для 9 класу</div>
    </div>
    <div class="progress-wrap">
      <div class="progress-label"><span>Пройдено пунктів</span><span id="progressText">0 / 23</span></div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    </div>
    <div id="chapters"></div>
  </nav>

  <main class="main">
    <div class="topbar">
      <div class="crumbs" id="crumbs">Оберіть тему зліва</div>
      <button class="reset-link" id="resetProgressBtn" title="Скинути весь прогрес">Скинути прогрес</button>
    </div>

    <div id="topicArea"></div>
  </main>
</div>

<script>
/* ================= Data: textbook structure ================= */
const CHAPTERS = [
  { id:'s1', title:'§1. Нерівності', topics:[
    {id:1, title:'Числові нерівності', blurb:'Що означає "більше" і "менше" для чисел, і як порівнювати вирази через їхню різницю.'},
    {id:2, title:'Основні властивості числових нерівностей', blurb:'Правила, які дозволяють перетворювати нерівності, не порушуючи знак порівняння.'},
    {id:3, title:'Додавання і множення числових нерівностей. Оцінювання значення виразу', blurb:'Як із кількох нерівностей отримати нову й оцінити, у яких межах лежить вираз.'},
    {id:4, title:'Нерівності з однією змінною', blurb:'Що таке розв’язок нерівності і чим він відрізняється від розв’язку рівняння.'},
    {id:5, title:'Розв’язування лінійних нерівностей з однією змінною. Числові проміжки', blurb:'Алгоритм розв’язування лінійних нерівностей і запис відповіді у вигляді проміжку.'},
    {id:6, title:'Системи лінійних нерівностей з однією змінною', blurb:'Як знайти спільний розв’язок одразу кількох нерівностей.'},
  ]},
  { id:'s2', title:'§2. Квадратична функція', topics:[
    {id:7, title:'Повторення та розширення відомостей про функцію', blurb:'Область визначення, область значень, способи задання функції.'},
    {id:8, title:'Властивості функції', blurb:'Зростання, спадання, нулі функції, проміжки знакосталості.'},
    {id:9, title:'Побудова графіка функції y = ax²', blurb:'Як коефіцієнт a змінює форму й напрям віт­ок параболи.'},
    {id:10, title:'Побудова графіків функцій y = x² + b і y = (x + a)²', blurb:'Зсуви параболи вздовж осей координат.'},
    {id:11, title:'Квадратична функція, її графік і властивості', blurb:'Загальний вигляд y = ax² + bx + c: вершина параболи та всі її властивості.'},
    {id:12, title:'Розв’язування квадратних нерівностей', blurb:'Як використовувати графік параболи, щоб розв’язувати нерівності другого степеня.'},
    {id:13, title:'Системи рівнянь із двома змінними', blurb:'Способи підстановки й додавання для систем, де є нелінійне рівняння.'},
    {id:14, title:'Система двох рівнянь із двома змінними як математична модель прикладної задачі', blurb:'Як перекладати текстову задачу мовою системи рівнянь.'},
  ]},
  { id:'s3', title:'§3. Числові послідовності', topics:[
    {id:15, title:'Числові послідовності', blurb:'Що таке послідовність, способи її задання — формулою або рекурентно.'},
    {id:16, title:'Арифметична прогресія', blurb:'Послідовність зі сталою різницею та формула її n-го члена.'},
    {id:17, title:'Сума n перших членів арифметичної прогресії', blurb:'Формула суми перших n членів арифметичної прогресії та її виведення.'},
    {id:18, title:'Геометрична прогресія', blurb:'Послідовність зі сталим знаменником та формула її n-го члена.'},
    {id:19, title:'Сума n перших членів геометричної прогресії', blurb:'Формула суми перших n членів геометричної прогресії.'},
  ]},
  { id:'s4', title:'§4. Основи комбінаторики, теорії ймовірностей та статистики', topics:[
    {id:20, title:'Основні правила комбінаторики', blurb:'Правило суми та правило добутку для підрахунку кількості варіантів.'},
    {id:21, title:'Частота та ймовірність випадкової події', blurb:'Як оцінювати ймовірність на основі серії експериментів.'},
    {id:22, title:'Класичне визначення ймовірності', blurb:'Ймовірність як відношення числа сприятливих наслідків до числа всіх наслідків.'},
    {id:23, title:'Початкові відомості про статистику', blurb:'Середнє значення, мода, медіана і як працювати з вибірками даних.'},
  ]},
];

const TOTAL_TOPICS = CHAPTERS.reduce((a,c)=>a+c.topics.length,0);

/* ================= State ================= */
const STORE_KEY = 'alg9_tutor_progress_v1';
const SERVER_URL = 'https://gemini-api-server-dnzk.onrender.com/api/generate';
let progress = loadProgress();
let activeTopicId = null;
let activeTab = 'explain'; // explain | homework | quiz

// per (topicId::tab) conversation memory, kept in-session
const conversations = {}; // key -> [{role, content}]

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    return raw ? JSON.parse(raw) : { done:{} };
  }catch(e){ return { done:{} }; }
}
function saveProgress(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(progress)); }catch(e){ /* ignore */ }
}

function allTopicsFlat(){
  return CHAPTERS.flatMap(c => c.topics.map(t => ({...t, chapter:c.title})));
}
function getTopic(id){ return allTopicsFlat().find(t => t.id === id); }

/* ================= Render: rail ================= */
function renderRail(){
  const wrap = document.getElementById('chapters');
  wrap.innerHTML = '';
  CHAPTERS.forEach(ch=>{
    const head = document.createElement('div');
    head.className = 'chapter-head';
    head.textContent = ch.title;
    wrap.appendChild(head);
    const box = document.createElement('div');
    box.className = 'chapter';
    ch.topics.forEach(t=>{
      const btn = document.createElement('button');
      const done = !!progress.done[t.id];
      btn.className = 'topic-btn' + (t.id===activeTopicId ? ' active':'') + (done ? ' done':'');
      btn.innerHTML = `<span class="num">${done ? '✓' : t.id}</span><span class="ttl">${escapeHtml(t.title)}</span>`;
      btn.addEventListener('click', ()=> selectTopic(t.id));
      box.appendChild(btn);
    });
    wrap.appendChild(box);
  });
  updateProgressBar();
}
function updateProgressBar(){
  const done = Object.values(progress.done).filter(Boolean).length;
  document.getElementById('progressText').textContent = `${done} / ${TOTAL_TOPICS}`;
  document.getElementById('progressFill').style.width = (done/TOTAL_TOPICS*100) + '%';
}

/* ================= Render: main topic area ================= */
function selectTopic(id){
  activeTopicId = id;
  activeTab = 'explain';
  renderRail();
  renderTopicArea();
}

function renderTopicArea(){
  const area = document.getElementById('topicArea');
  const crumbs = document.getElementById('crumbs');
  if(!activeTopicId){
    crumbs.textContent = 'Оберіть тему зліва';
    area.innerHTML = `<div class="topic-card"><div class="empty-state">
      Оберіть пункт підручника у списку зліва — я допоможу розібратися в темі, розв’язати домашнє завдання
      крок за кроком або перевірити себе міні-тестом.</div></div>`;
    return;
  }
  const t = getTopic(activeTopicId);
  crumbs.innerHTML = `<b>${escapeHtml(t.chapter)}</b> · Пункт ${t.id}`;
  const done = !!progress.done[t.id];

  area.innerHTML = `
    <div class="topic-card">
      <h1 class="topic-title">${t.id}. ${escapeHtml(t.title)}</h1>
      <p class="topic-blurb">${escapeHtml(t.blurb)}</p>
      <label class="mark-done">
        <input type="checkbox" id="doneCheck" ${done?'checked':''}>
        Позначити пункт як пройдений
      </label>
      <div class="tabs" id="tabs">
        <button class="tab" data-tab="explain">Поясни тему</button>
        <button class="tab" data-tab="homework">Допоможи з домашнім завданням</button>
        <button class="tab" data-tab="quiz">Перевір себе</button>
      </div>
    </div>
    <div id="panelWrap"></div>
  `;
  document.getElementById('doneCheck').addEventListener('change', e=>{
    progress.done[t.id] = e.target.checked;
    saveProgress(); renderRail();
  });
  document.querySelectorAll('#tabs .tab').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.tab === activeTab);
    btn.addEventListener('click', ()=>{ activeTab = btn.dataset.tab; renderTopicArea(); });
  });
  renderPanel(t);
}

function renderPanel(t){
  const wrap = document.getElementById('panelWrap');
  if(activeTab === 'quiz'){
    wrap.innerHTML = `
      <div class="panel">
        <p class="panel-hint">Я згенерую задачу за темою «${escapeHtml(t.title)}». Спочатку розв’яжи сам(а) на чернетці — потім тисни «Показати підказку» або «Показати відповідь».</p>
        <div id="quizArea"><div class="empty-state">Натисніть кнопку нижче, щоб отримати задачу.</div></div>
        <div class="quiz-actions">
          <button class="ghost-btn primary" id="genQuizBtn">Дати задачу за темою</button>
        </div>
      </div>`;
    document.getElementById('genQuizBtn').addEventListener('click', ()=>generateQuiz(t));
    return;
  }

  // explain / homework share the chat UI, different system prompts + quick chips
  const key = t.id + '::' + activeTab;
  if(!conversations[key]) conversations[key] = [];
  const hint = activeTab === 'explain'
    ? 'Я поясню тему своїми словами, з прикладами і запитаннями по ходу — не просто перекажу параграф.'
    : '<b>Важливо:</b> надішли своє умова задачі та те, що вже пробував(ла). Я ставитиму навідні запитання, а не розв’язуватиму замість тебе.';
  const chips = activeTab === 'explain'
    ? ['Поясни з самого початку', 'Наведи приклад', 'У чому тут складність для мене?']
    : ['Я не знаю, з чого почати', 'Перевір моє розв’язання', 'Дай підказку, не розв’язання'];

  wrap.innerHTML = `
    <div class="panel">
      <p class="panel-hint">${hint}</p>
      <div class="chat-log" id="chatLog"></div>
      <div class="quick-row" id="quickRow"></div>
      <div class="composer">
        <textarea id="msgInput" rows="1" placeholder="${activeTab==='explain' ? 'Запитай про тему або попроси пояснити з прикладом…' : 'Опиши задачу своїми словами або встав умову…'}"></textarea>
        <button class="send-btn" id="sendBtn">Надіслати</button>
      </div>
    </div>`;

  const chipsRow = document.getElementById('quickRow');
  chips.forEach(c=>{
    const b = document.createElement('button');
    b.className = 'quick-chip'; b.textContent = c;
    b.addEventListener('click', ()=> sendMessage(t, c));
    chipsRow.appendChild(b);
  });

  renderChatLog(key);
  const input = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  sendBtn.addEventListener('click', ()=>{
    const val = input.value.trim();
    if(!val) return;
    input.value = '';
    sendMessage(t, val);
  });
  input.addEventListener('keydown', e=>{
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault(); sendBtn.click();
    }
  });
  input.addEventListener('input', ()=>{
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  });

  // greet once per topic/tab
  if(conversations[key].length === 0){
    const greet = activeTab === 'explain'
      ? `Привіт! Розбираємо пункт «${t.title}». З чого хочеш почати: із самого поняття, з прикладу чи в тебе вже є запитання?`
      : `Привіт! Надішли умову задачі за темою «${t.title}» і те, що ти вже встиг(ла) спробувати — навіть якщо це просто думки вголос. Далі розберемося разом.`;
    conversations[key].push({role:'assistant', content: greet, synthetic:true});
    renderChatLog(key);
  }
}

function renderChatLog(key){
  const log = document.getElementById('chatLog');
  if(!log) return;
  log.innerHTML = '';
  conversations[key].forEach(m=>{
    const div = document.createElement('div');
    div.className = 'msg ' + (m.role === 'user' ? 'student' : 'tutor');
    div.innerHTML = `<span class="label">${m.role==='user' ? 'Ти' : 'Репетитор'}</span>` + formatMsg(m.content);
    log.appendChild(div);
  });
  log.scrollTop = log.scrollHeight;
}

/* ================= Messaging via the team's Gemini server ================= */
async function callServer(prompt){
  try{
    const resp = await fetch(SERVER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt })
    });
    const data = await resp.json();
    return data.ok ? { ok:true, text:data.text } : { ok:false, text:'' };
  }catch(e){
    return { ok:false, text:'' };
  }
}

function systemPromptFor(t, tab){
  const base = `Ти — терплячий репетитор з алгебри для українського 9 класу, працюєш строго за підручником
Мерзляка А. Г. і Якіра М. С. «Алгебра. 9 клас» (§ ${topicChapterNumber(t)}, пункт ${t.id}: «${t.title}»).
Тема пункту: ${t.blurb}

ГОЛОВНЕ ПРАВИЛО: ніколи не давай одразу готове розв’язання або готову відповідь, навіть якщо учень просить.
Твоя робота — підвести учня до розуміння, а не розв’язати замість нього. Дій як хороший репетитор біля дошки:
1) Спочатку зрозумій, що учень уже знає і де саме затримка — за потреби постав одне уточнювальне запитання.
2) Веди маленькими кроками: став навідні запитання, пропонуй учневі зробити наступний крок самостійно.
3) Якщо учень помилився — не кажи прямо "неправильно", допоможи йому самому знайти й зрозуміти помилку.
4) Повне розв’язання можна показати лише якщо учень уже кілька разів пробував сам і явно просить фінальну
   перевірку — і навіть тоді супроводжуй розв’язання поясненням "чому", а не лише формулами.
5) Пиши компактно (зазвичай 3-6 речень), доброзичливо, українською мовою, без канцеляриту.
   Математику пиши звичайним рядком: x^2, sqrt(x), <= , >=, використовуй ², ³, √, ≤, ≥, ± де доречно.
6) Хвали за правильні кроки коротко й по суті, не будь приторним.
7) Відповідай ЛИШЕ текстом власної репліки репетитора — без ярликів на кшталт "Репетитор:" і без переказу
   попередніх реплік діалогу.`;

  if(tab === 'explain'){
    return base + `\n\nРежим: "Поясни тему". Учень хоче розібратися в новій темі з підручника. Пояснюй поняття
своїми словами, з наочним прикладом, але чергуй пояснення з короткими перевірними запитаннями
("а як думаєш, чому...", "спробуй сам продовжити..."), щоб учень не просто читав, а думав.`;
  }
  return base + `\n\nРежим: "Допоможи з домашнім завданням". Учень надіслав свою задачу або її частину. Не розв’язуй
задачу повністю. Допоможи визначити, що потрібно знайти, який метод із цього пункту підходить, і дай учневі
зробити наступний крок самостійно. Якщо учень надіслав своє розв’язання — спочатку оціни, де воно правильне,
і м’яко вкажи напрям, де шукати помилку, не називаючи її прямо одразу.`;
}

function topicChapterNumber(t){
  const idx = CHAPTERS.findIndex(c => c.topics.some(x=>x.id===t.id));
  return idx+1;
}

// Сервер приймає лише один текстовий prompt (без списку messages/ролей),
// тож весь діалог доводиться серіалізувати в один текст перед кожним викликом.
function buildDialoguePrompt(t, tab, key){
  const sys = systemPromptFor(t, tab);
  const history = conversations[key].filter(m => !m.synthetic);
  const turns = history.map(m => (m.role === 'user' ? 'Учень: ' : 'Репетитор: ') + m.content).join('\n\n');
  return `${sys}\n\n— Далі йде історія діалогу з учнем —\n\n${turns}\n\nРепетитор:`;
}

async function sendMessage(t, text){
  const key = t.id + '::' + activeTab;
  conversations[key].push({role:'user', content:text});
  renderChatLog(key);
  await runTutorTurn(t, key);
}

async function runTutorTurn(t, key){
  const log = document.getElementById('chatLog');
  // typing indicator
  const typingDiv = document.createElement('div');
  typingDiv.className = 'msg tutor';
  typingDiv.innerHTML = `<span class="label">Репетитор</span><div class="typing"><span></span><span></span><span></span></div>`;
  if(log){ log.appendChild(typingDiv); log.scrollTop = log.scrollHeight; }

  const sendBtn = document.getElementById('sendBtn');
  if(sendBtn) sendBtn.disabled = true;

  const prompt = buildDialoguePrompt(t, activeTab, key);
  const res = await callServer(prompt);

  if(res.ok && res.text){
    conversations[key].push({role:'assistant', content: res.text.trim()});
  }else{
    conversations[key].push({role:'assistant', content: 'Не вдалося отримати відповідь від сервера. Перевірте з’єднання й спробуйте надіслати ще раз.'});
  }
  if(sendBtn) sendBtn.disabled = false;
  renderChatLog(key);
}

/* ================= Quiz mode ================= */
async function generateQuiz(t){
  const area = document.getElementById('quizArea');
  area.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;

  const prompt = `Ти складаєш ОДНУ тренувальну задачу для українського 9 класу за підручником Мерзляка/Якіра,
§ пункт ${t.id}: «${t.title}» (${t.blurb}).
Рівень — середній (не найлегший, не олімпіадний).
Відповідай СТРОГО у форматі JSON без будь-яких пояснень до або після, без markdown-обрамлення:
{
  "problem": "текст задачі українською, компактно",
  "hint": "одна навідна підказка, що не розкриває розв’язання",
  "answer": "коротка фінальна відповідь",
  "explanation": "3-5 речень чому це так, хід розв’язання крок за кроком"
}
Математику пиши звичайним текстом (x^2, sqrt, <=, >=, ², ³, √, ≤, ≥).`;

  const res = await callServer(prompt);
  const data = res.ok ? parseQuizJson(res.text) : null;
  if(data && data.problem){
    renderQuizCard(t, data);
  }else{
    area.innerHTML = `<div class="empty-state">Не вдалося скласти задачу. Спробуй ще раз.</div>`;
  }
}

// Сервер іноді обгортає JSON у markdown-огорожі або додає текст навколо —
// тому шукаємо перший повний {...} блок і парсимо саме його.
function parseQuizJson(raw){
  const txt = (raw || '').trim();
  try{
    const obj = JSON.parse(txt);
    if(obj && typeof obj === 'object') return obj;
  }catch(e){ /* fall through */ }
  const first = txt.indexOf('{');
  const last = txt.lastIndexOf('}');
  if(first !== -1 && last !== -1 && last > first){
    try{
      const obj = JSON.parse(txt.slice(first, last+1));
      if(obj && typeof obj === 'object') return obj;
    }catch(e){ /* ignore */ }
  }
  return null;
}

function renderQuizCard(t, data){
  const area = document.getElementById('quizArea');
  area.innerHTML = `
    <div class="quiz-card">
      <p class="quiz-q">${formatMsg(data.problem || '')}</p>

        <button class="ghost-btn" id="answerBtn">Показати відповідь і розбір</button>
      </div>
      <div id="hintBox"></div>
      <div id="answerBox"></div>
    </div>`;
  document.getElementById('hintBtn').addEventListener('click', ()=>{
    document.getElementById('hintBox').innerHTML = `<div class="reveal"><span class="k">Підказка.</span> ${formatMsg(data.hint||'')}</div>`;
  });
  document.getElementById('answerBtn').addEventListener('click', ()=>{

      <span class="k">Відповідь.</span> ${formatMsg(data.answer||'')}<br><br>
      <span class="k">Розбір.</span> ${formatMsg(data.explanation||'')}
    </div>`;
  });
}

/* ================= Utils ================= */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatMsg(raw){
  let s = escapeHtml(raw || '');
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // simple list handling
  const lines = s.split(/\n/);
  let html = ''; let inList = false;
  for(const line of lines){
    const trimmed = line.trim();
    if(/^[-•]\s+/.test(trimmed)){
      if(!inList){ html += '<ul>'; inList = true; }
      html += '<li>' + trimmed.replace(/^[-•]\s+/, '') + '</li>';
    }else{
      if(inList){ html += '</ul>'; inList = false; }
      if(trimmed === ''){ continue; }
      html += '<p>' + line + '</p>';
    }
  }
  if(inList) html += '</ul>';
  return html || '<p></p>';
}
